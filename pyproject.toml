[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert — allowed in tests
]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101"]  # asserts OK in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
