{% extends "base.html" %}
{% block title %}Outfit boards — Cloth{% endblock %}
{% block content %}
<section class="outfits-page">
  <div class="outfits-page-header">
    <h1>Outfit boards</h1>
    <button id="new-outfit-btn" class="btn-new-outfit">+ New outfit</button>
  </div>
  <div id="outfits-container">
    <p class="outfits-empty">No outfit boards yet. Create one to start collecting items.</p>
  </div>
  <section class="canvas-saves-section" aria-label="Saved canvases">
    <h2 class="canvas-saves-heading">Saved canvases</h2>
    <div id="canvas-saves-container">
      <p class="canvas-saves-empty">No saved canvases yet. Build a canvas in the style tool and click "Save canvas".</p>
    </div>
  </section>
</section>
{% endblock %}
