<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}dress.me{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}dress.me — search across the web for any clothing item using plain English. AI-powered results from hundreds of retailers.{% endblock %}">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Search across the web for any clothing item using plain English. AI-powered results from hundreds of retailers.{% endblock %}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme-init.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="container">
      <div class="site-header-top">
        <a href="/start" class="logo" aria-label="dress.me — home">
          <span class="logo-wordmark">dress.me</span>
        </a>
        <a href="/outfits" class="outfits-link" aria-label="Your outfit boards" style="white-space:nowrap">Build a look</a>
        <a href="/saved" class="saved-link" id="saved-link" aria-label="Saved items">Saved<span class="nav-count" id="saved-count" hidden></span></a>
        <button type="button" id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="icon icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18">
            <circle cx="10" cy="10" r="4"/>
            <line x1="10" y1="2" x2="10" y2="4"/>
            <line x1="10" y1="16" x2="10" y2="18"/>
            <line x1="2" y1="10" x2="4" y2="10"/>
            <line x1="16" y1="10" x2="18" y2="10"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="14.36" y1="14.36" x2="15.78" y2="15.78"/>
            <line x1="4.22" y1="15.78" x2="5.64" y2="14.36"/>
            <line x1="14.36" y1="5.64" x2="15.78" y2="4.22"/>
          </svg>
        </button>
      </div>
      <form class="header-search" method="get" action="/search">
        <input type="text" name="q" placeholder="What are you looking for?"
               value="{{ query|default('') }}" maxlength="500" aria-label="Search clothing"
               list="cloth-autocomplete-header" autocomplete="off">
        <datalist id="cloth-autocomplete-header"></datalist>
        <button type="submit">Search</button>
      </form>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p><a href="/how-it-works">How it works</a> &middot; <a href="/outfit-generator">Build a look</a> &middot; <a href="/privacy">Privacy Notice</a> &middot; Prices are indicative. Check the retailer for current price and availability.</p>
    </div>
  </footer>
  <script src="/static/js/cloth-pure.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/style-canvas.js"></script>

  <!-- Mobile bottom navigation (WN-157, simplified WN-238) -->
  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="/start" class="mobile-nav-tab" data-nav="home" aria-label="Home">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M7 18V12h6v6"/></svg>
      <span>Home</span>
    </a>
    <a href="/outfits" class="mobile-nav-tab" data-nav="outfits" aria-label="Your outfit boards">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20"><rect x="2" y="3" width="7" height="9" rx="1"/><rect x="11" y="3" width="7" height="5" rx="1"/><rect x="11" y="11" width="7" height="6" rx="1"/><rect x="2" y="15" width="7" height="2" rx="1"/></svg>
      <span>Build</span>
    </a>
    <a href="/saved" class="mobile-nav-tab" data-nav="saved" aria-label="Saved items">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20"><path d="M10 17l-7-7a4 4 0 015.66-5.66L10 5.66l1.34-1.34A4 4 0 0117 10l-7 7z"/></svg>
      <span>Saved</span>
    </a>
  </nav>

  <!-- Image lightbox (WN-156) -->
  <div id="img-lightbox" class="img-lightbox" role="dialog" aria-modal="true" aria-label="Product image" style="display:none">
    <div class="img-lightbox-backdrop"></div>
    <div class="img-lightbox-inner">
      <button class="img-lightbox-close" aria-label="Close image">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="20" height="20">
          <line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/>
        </svg>
      </button>
      <img id="img-lightbox-img" src="" alt="" class="img-lightbox-img">
    </div>
  </div>

  <!-- Style canvas modal (WN-112) -->
  <div id="style-canvas-modal" role="dialog" aria-modal="true" aria-label="Style canvas" style="display:none">
    <div class="style-canvas-inner">
      <button class="style-canvas-close" aria-label="Close style canvas">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="18" height="18">
          <line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/>
        </svg>
      </button>
      <div class="style-canvas-base-selector" id="style-base-selector">
        <p>Choose a base:</p>
        <button class="base-option" data-silhouette="/static/img/silhouettes/neutral.svg" aria-label="Neutral silhouette">Neutral</button>
        <button class="base-option" data-silhouette="/static/img/silhouettes/feminine.svg" aria-label="Feminine silhouette">Feminine</button>
        <button class="base-option" data-silhouette="/static/img/silhouettes/masculine.svg" aria-label="Masculine silhouette">Masculine</button>
      </div>
      <div id="style-canvas-main" style="display:none">
        <div class="style-canvas-actions">
          <button type="button" id="style-canvas-undo" class="btn-secondary" aria-label="Undo" disabled>Undo</button>
          <button type="button" id="style-canvas-redo" class="btn-secondary" aria-label="Redo" disabled>Redo</button>
          <button type="button" id="style-canvas-download" class="btn-secondary">Download PNG</button>
        </div>
        <div class="style-canvas-editor">
          <canvas id="style-canvas" width="500" height="700"></canvas>
          <div class="style-canvas-sidebar" id="style-canvas-sidebar" aria-label="Layer controls"></div>
        </div>
      </div>
      <div id="style-canvas-live" aria-live="polite" class="sr-only"></div>
    </div>
  </div>

  <!-- Curated list bar (WN-046) -->
  <div class="curated-list-bar" id="curated-list-bar" role="region" aria-label="Curated list" hidden>
    <div class="curated-list-bar-inner">
      <span class="curated-list-bar-count" id="curated-list-bar-count" aria-live="polite"></span>
      <a href="#" id="curated-list-share-link" class="btn-primary curated-list-share-btn" aria-label="Share curated list">Share list</a>
      <button type="button" class="btn-curated-list-clear" id="curated-list-clear" aria-label="Clear curated list">Clear</button>
    </div>
  </div>

  <!-- Compare bar (WN-136) — moved to base.html so it works on all pages -->
  <div class="compare-bar" id="compare-bar" role="region" aria-label="Item comparison" hidden>
    <div class="compare-bar-inner">
      <div class="compare-items" id="compare-items" aria-label="Items selected for comparison"></div>
      <button type="button" class="btn-compare-clear" id="compare-clear" aria-label="Clear all items from comparison">Clear</button>
    </div>
  </div>

  <!-- Reusable inline dialog (WN-131) -->
  <dialog id="app-dialog" class="app-dialog" aria-modal="true">
    <form method="dialog" class="app-dialog-form">
      <h2 id="app-dialog-title" class="app-dialog-title"></h2>
      <p id="app-dialog-message" class="app-dialog-message" hidden></p>
      <input id="app-dialog-input" class="app-dialog-input" type="text" autocomplete="off">
      <div class="app-dialog-actions">
        <button type="button" id="app-dialog-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" id="app-dialog-ok" class="btn-primary">OK</button>
      </div>
    </form>
  </dialog>
  <!-- WN-173: card action sheet (mobile) -->
  <div id="card-action-sheet" class="card-action-sheet" hidden>
    <div class="card-action-sheet-backdrop" id="card-action-sheet-backdrop"></div>
    <div class="card-action-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="card-action-sheet-title">
      <div class="card-action-sheet-header">
        <span class="card-action-sheet-title" id="card-action-sheet-title"></span>
        <button type="button" class="card-action-sheet-close" aria-label="Close options panel">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="18" height="18">
            <line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/>
          </svg>
        </button>
      </div>
      <div class="card-action-sheet-actions" id="card-action-sheet-actions"></div>
    </div>
  </div>
  <!-- WN-175: Skimlinks affiliate monetisation -->
  <script type="text/javascript" src="https://s.skimresources.com/js/307776X1796068.skimlinks.js"></script>

  <!-- Mobile bottom search bar (WN-168) -->
  <div id="mobile-search-bar" class="mobile-search-bar" hidden>
    <form class="mobile-search-form" action="/search" method="get" role="search" aria-label="Quick search">
      <input type="search" name="q" class="mobile-search-input" placeholder="What are you looking for?" aria-label="Search" autocomplete="off" maxlength="200">
      <button type="submit" class="mobile-search-submit" aria-label="Search">&#128269;</button>
    </form>
  </div>
</body>
</html>
