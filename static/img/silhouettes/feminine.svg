<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600" aria-label="Feminine body silhouette">
  <title>Feminine body silhouette</title>
  <!-- Head — slightly smaller, rounder -->
  <circle cx="150" cy="58" r="36" fill="none" stroke="#555" stroke-width="3"/>
  <!-- Neck — slimmer -->
  <line x1="140" y1="93" x2="138" y2="114" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="93" x2="162" y2="114" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Shoulders / hourglass torso -->
  <path d="M 138 114 Q 104 120 92 140 L 86 180 Q 80 200 92 218 Q 100 230 110 234 L 108 268 Q 100 280 90 290 Q 78 306 80 324 Q 84 348 108 356 L 192 356 Q 216 348 220 324 Q 222 306 210 290 Q 200 280 192 268 L 190 234 Q 200 230 208 218 Q 220 200 214 180 L 208 140 Q 196 120 162 114 Z"
        fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left arm — slender -->
  <path d="M 92 143 Q 70 168 62 220 Q 58 242 66 252 Q 74 262 82 252 Q 88 242 90 226 L 96 174"
        fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm — slender -->
  <path d="M 208 143 Q 230 168 238 220 Q 242 242 234 252 Q 226 262 218 252 Q 212 242 210 226 L 204 174"
        fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left leg — tapered -->
  <path d="M 108 356 L 98 440 L 90 520 Q 88 536 98 542 Q 108 548 114 536 L 120 456 L 128 356"
