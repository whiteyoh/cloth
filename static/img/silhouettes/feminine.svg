  <!-- Right leg — tapered -->
  <path d="M 192 356 L 202 440 L 210 520 Q 212 536 202 542 Q 192 548 186 536 L 180 456 L 172 356"
        fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left foot -->
  <path d="M 98 542 Q 88 550 84 554 Q 80 562 90 566 L 116 566 Q 124 566 122 554 L 114 536"
        fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right foot -->
  <path d="M 202 542 Q 212 550 216 554 Q 220 562 210 566 L 184 566 Q 176 566 178 554 L 186 536"
        fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
